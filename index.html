    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --store-color: #e31e24; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; transition: all 0.5s ease; font-style: italic; }
        
        .hero-banner { 
            position: relative; height: 650px; border-radius: 0 0 4rem 4rem; 
            display: flex; align-items: center; padding: 0 8%; color: white;
            overflow: hidden; background-color: #111;
        }
        .hero-img-bg {
            position: absolute; right: 0; top: 0; width: 75%; height: 100%;
            background-size: cover; background-position: center; z-index: 1; transition: background-image 0.6s ease;
        }
        .hero-gradient {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(90deg, var(--store-color) 0%, var(--store-color) 25%, rgba(0,0,0,0) 85%);
        }

        .recipe-card {
            background: white; border-radius: 3.5rem; padding: 1.75rem;
            border: 2px solid transparent; transition: all 0.4s ease; height: 480px; display: flex; flex-direction: column;
        }

        .img-container { height: 240px; width: 100%; border-radius: 2.2rem; overflow: hidden; margin-bottom: 1.5rem; position: relative; background: var(--store-color); flex-shrink: 0; }
        .recipe-img { height: 100%; width: 100%; object-fit: cover; position: absolute; z-index: 5; top:0; left:0; transition: opacity 0.3s; }
        
        .fallback-content {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            padding: 25px; text-align: center; color: white; font-weight: 800; font-size: 1.1rem;
            text-transform: uppercase; z-index: 2; line-height: 1.2;
        }

        #recipeModal { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); padding: 40px; overflow-y: auto; }
        .modal-content { background: white; max-width: 1100px; margin: auto; border-radius: 3.5rem; display: flex; flex-direction: column; overflow: hidden; min-height: 80vh; }
        @media (min-width: 768px) { .modal-content { flex-direction: row; } }
        .modal-text-side { flex: 1; padding: 3rem; overflow-y: auto; font-style: normal; }
        .modal-img-side { width: 100%; height: 300px; position: relative; background: var(--store-color); }
        @media (min-width: 768px) { .modal-img-side { width: 45%; height: auto; } }

        @media print {
            body * { visibility: hidden; }
            #grocerySection, #grocerySection * { visibility: visible; }
            #grocerySection { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 0; shadow: none; }
            #grocerySection button { display: none; }
        }
    </style>
</head>

                    { name: "Shortcake aux Fraises", price: 10.80, items: ["Fraises", "Gâteau éponge", "Crème chantilly"], img: "https://images.unsplash.com/photo-1464305795204-6f5bdf7f8740", steps: ["Couper le gâteau en deux tranches.", "Imbiber d'un peu de sirop de fraise.", "Couvrir de fraises et de crème fouettée.", "Refermer avec la deuxième tranche.", "Décorer le dessus avec une fraise entière."] },
                    { name: "Fraises au Chocolat", price: 12.00, items: ["Fraises", "Chocolat noir", "Beurre"], img: "https://images.unsplash.com/photo-1511381939415-e44015466834", steps: ["Faire fondre le chocolat au bain-marie.", "Tremper chaque fraise à moitié dans le chocolat.", "Déposer sur une plaque recouverte de papier parchemin.", "Laisser durcir au réfrigérateur.", "Une gâterie simple et élégante."] },
                    { name: "Confiture de Fraises Minute", price: 7.40, items: ["Fraises", "Sucre", "Citron"], img: "https://images.unsplash.com/photo-1490818387583-1baba5e638af", steps: ["Écraser les fraises grossièrement.", "Mélanger avec le sucre et le jus de citron.", "Cuire à feu moyen 15 minutes.", "Mettre en pot dès que la texture s'épaissit.", "Délicieux sur des toasts le matin."] },
                    { name: "Bruschetta aux Fraises", price: 9.90, items: ["Fraises", "Pain baguette", "Basilic"], img: "https://images.unsplash.com/photo-1572656631137-7935297eff55", steps: ["Griller des tranches de baguette.", "Mélanger dés de fraises, basilic et huile d'olive.", "Disposer sur le pain.", "Ajouter une goutte de crème de balsamique.", "Une entrée surprenante et fraîche."] }
                ]
            }
        };

        function getImgHTML(recipe, storeColor) {
            const fallback = `<div class="fallback-content" style="background:${storeColor}">${recipe.name}</div>`;
            return `${fallback}<img class="recipe-img" src="${recipe.img}" onerror="this.style.opacity='0'">`;
        }

        function switchStore(id) {
            const config = storeData[id];
            document.body.style.setProperty('--store-color', config.color);
            document.getElementById('bannerTitle').innerHTML = `LE MENU <br> ${config.name}`;
            document.getElementById('heroImg').style.backgroundImage = `url('${config.hero}')`;
            document.getElementById('navBrandIcon').style.backgroundColor = config.color;
            document.getElementById('featuredItemName').innerText = config.vedette;
            document.getElementById('featuredPrice').innerText = config.vPrice;
            document.getElementById('savingsPercent').innerText = config.savings;
            document.getElementById('savingsPercent').style.color = config.color;
            document.getElementById('flyerLink').href = config.url;
            document.getElementById('flyerName').innerText = config.name;

            document.querySelectorAll('.store-tab').forEach(b => { 
                b.style.backgroundColor = 'transparent'; b.style.color = '#94a3b8'; 
            });
            document.getElementById(`btn-${id}`).style.backgroundColor = config.color;
            document.getElementById(`btn-${id}`).style.color = 'white';
            render(id);
        }

        function render(storeId) {
            const store = storeData[storeId];
            const grid = document.getElementById('recipeGrid');
            const grocery = document.getElementById('groceryList');
            grid.innerHTML = ''; grocery.innerHTML = '';

            const first = store.recipes[0];
            document.getElementById('featuredRecipe').innerHTML = `
                <div class="recipe-card shadow-2xl" style="border-color: ${store.color}44;">
                    <div class="img-container">${getImgHTML(first, store.color)}</div>
                    <h3 class="font-black text-3xl uppercase italic mb-8">${first.name}</h3>
                    <div class="flex justify-between items-center">
                        <span class="text-4xl font-black italic" style="color:${store.color}">${first.price.toFixed(2)} $</span>
                        <button onclick='openModal("${storeId}", 0)' class="bg-slate-950 text-white text-[10px] font-black px-8 py-4 rounded-2xl uppercase italic">Voir recette</button>
                    </div>
                </div>`;

            store.recipes.slice(1).forEach((r, idx) => {
                grid.innerHTML += `
                    <div class="recipe-card" style="border-color: ${store.color}22;">
                        <div class="img-container">${getImgHTML(r, store.color)}</div>
                        <h3 class="font-black text-xl uppercase italic mb-8 h-14 overflow-hidden">${r.name}</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-2xl font-black italic" style="color:${store.color}">${r.price.toFixed(2)} $</span>
                            <button onclick='openModal("${storeId}", ${idx + 1})' class="bg-slate-950 text-white text-[10px] font-black px-6 py-3 rounded-2xl uppercase italic">Détails</button>
                        </div>
                    </div>`;
            });

            [...new Set(store.recipes.flatMap(r => r.items))].sort().forEach(item => {
                grocery.innerHTML += `<div class="p-4 bg-white/10 rounded-2xl border border-white/20 text-[9px] font-bold uppercase italic">${item}</div>`;
            });

            document.getElementById('comparisonBars').innerHTML = Object.keys(storeData).map(s => {
                const val = parseInt(storeData[s].savings.replace('-',''));
                return `<div class="flex flex-col items-center">
                    <span class="text-[10px] font-black mb-2" style="color:${storeData[s].color}">${storeData[s].savings}</span>
                    <div class="w-8 bg-slate-100 rounded-full h-32 flex flex-col justify-end overflow-hidden">
                        <div style="height:${val*1.5}px; background-color:${storeData[s].color}"></div>
                    </div>
                    <span class="text-[8px] font-black uppercase mt-2 text-slate-400">${storeData[s].name}</span>
                </div>`;
            }).join('');
        }

        function openModal(storeId, idx) {
            const store = storeData[storeId];
            const r = store.recipes[idx];
            document.getElementById('modalTitle').innerText = r.name;
            document.getElementById('modalImgContainer').innerHTML = getImgHTML(r, store.color);
            document.getElementById('modalSteps').innerHTML = r.steps.map((s, i) => `
                <div class="flex gap-6">
                    <span class="text-slate-200 font-black italic text-5xl">0${i+1}</span>
                    <p class="text-slate-700 leading-relaxed font-medium pt-2">${s}</p>
                </div>`).join('');
            document.getElementById('recipeModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { 
            document.getElementById('recipeModal').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }

        switchStore('superc');
    </script>
</body>
</html>
