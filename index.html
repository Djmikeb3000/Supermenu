<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMenu | 35 Recettes de Saison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --store-color: #e31e24; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; transition: all 0.5s ease; font-style: italic; }
        
        .hero-banner { 
            position: relative; height: 650px; border-radius: 0 0 4rem 4rem; 
            display: flex; align-items: center; padding: 0 8%; color: white;
            overflow: hidden; background-color: #111;
        }
        .hero-img-bg {
            position: absolute; right: 0; top: 0; width: 75%; height: 100%;
            background-size: cover; background-position: center; z-index: 1; transition: background-image 0.6s ease;
        }
        .hero-gradient {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(90deg, var(--store-color) 0%, var(--store-color) 25%, rgba(0,0,0,0) 85%);
        }

        .recipe-card {
            background: white; border-radius: 3.5rem; padding: 1.75rem;
            border: 2px solid transparent; transition: all 0.4s ease;
        }

        .img-container { height: 240px; width: 100%; border-radius: 2.2rem; overflow: hidden; margin-bottom: 1.5rem; position: relative; background: #eee; }
        .recipe-img { height: 100%; width: 100%; object-fit: cover; position: absolute; z-index: 5; top:0; left:0; }
        
        .grocery-item { cursor: pointer; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.1); }
        .grocery-item.checked { opacity: 0.4; text-decoration: line-through; }

        #recipeModal { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); padding: 40px; }
        .modal-content { background: white; max-width: 1200px; margin: auto; border-radius: 3.5rem; display: flex; overflow: hidden; height: 85vh; position: relative; }
        .modal-text-side { width: 55%; padding: 4rem; overflow-y: auto; font-style: normal; }

        /* OPTIMISATION IMPRESSION 1 PAGE */
        @media print {
            @page { margin: 0.5cm; size: auto; }
            body * { visibility: hidden; background: white !important; }
            #grocerySection, #grocerySection * { visibility: visible; color: black !important; }
            #grocerySection { position: absolute; left: 0; top: 0; width: 100%; background: white !important; padding: 0 !important; border:none !important; }
            .no-print { display: none !important; }
            #groceryList { 
                display: block !important; 
                column-count: 3; 
                column-gap: 15px;
                font-size: 9pt;
            }
            .grocery-item { 
                border: 1px solid #eee !important; 
                margin-bottom: 5px !important; 
                padding: 6px !important; 
                page-break-inside: avoid;
                break-inside: avoid;
                display: flex !important;
            }
            h2 { font-size: 22pt !important; margin-bottom: 15px !important; color: black !important; }
        }
    </style>
</head>
<body class="text-slate-900">

    <nav class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-100 no-print">

                </div>
                <span class="text-2xl font-black uppercase not-italic tracking-tighter">SUPER<span class="text-slate-300">MENU</span></span>
            </div>
            <div class="flex bg-slate-100 p-2 rounded-2xl space-x-1">
                <button onclick="switchStore('superc')" id="btn-superc" class="store-tab text-[10px] font-black px-4 py-3 rounded-xl uppercase transition-all">Super C</button>
                <button onclick="switchStore('maxi')" id="btn-maxi" class="store-tab text-[10px] font-black px-4 py-3 rounded-xl uppercase transition-all">Maxi</button>
                <button onclick="switchStore('metro')" id="btn-metro" class="store-tab text-[10px] font-black px-4 py-3 rounded-xl uppercase transition-all">Métro</button>

        </div>
    </nav>

    <header class="hero-banner no-print">

        <div class="hero-gradient"></div>
        <div class="max-w-5xl relative z-10">

            <p class="max-w-2xl text-lg font-medium mb-8 text-white/90 leading-relaxed not-italic">
                C'est le temps des sucres ! Nos 35 nouvelles recettes maximisent vos économies selon les circulaires du Québec.
            </p>

            <div class="flex flex-wrap items-center gap-6 mb-8">
                <div class="bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-3xl flex items-center gap-6">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black uppercase tracking-widest text-white/60">Vedette Circulaire</span>
                        <span id="featuredItemName" class="text-2xl font-black italic uppercase tracking-tighter"></span>
                    </div>
                    <div class="h-10 w-[1px] bg-white/20"></div>
                    <span id="featuredPrice" class="text-3xl font-black italic"></span>
                </div>
            </div>
            
            <a id="circulaireLink" href="#" target="_blank" class="inline-block bg-white text-slate-900 px-8 py-4 rounded-2xl font-black uppercase italic text-[10px] shadow-2xl hover:scale-105 transition-transform">
                VOIR LA CIRCULAIRE <span id="circulaireName"></span>
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 mb-20 no-print">
            <div id="featuredRecipe"></div>
            <div class="lg:col-span-2 bg-white border border-slate-100 rounded-[4rem] p-12 shadow-sm flex flex-col md:flex-row justify-between items-center">
                <div class="text-left">
                    <h3 class="font-black text-4xl uppercase italic mb-4">ANALYSE ÉCO</h3>
                    <p id="savingsPercent" class="text-8xl font-black italic leading-none my-6"></p>
                    <p class="text-slate-400 text-[11px] uppercase font-black tracking-[0.3em]">Économies moyennes constatées</p>
                </div>
                <div class="flex items-end space-x-6" id="comparisonBars"></div>
            </div>
        </div>

        <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 mb-24 no-print"></div>

        <section id="grocerySection" class="bg-slate-950 rounded-[4rem] p-16 text-white shadow-2xl">
            <h2 class="text-5xl font-black uppercase italic mb-10">Votre Panier</h2>
            <div id="groceryList" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-16"></div>
            <div class="flex justify-center no-print">
                <button onclick="window.print()" class="bg-white text-slate-950 px-16 py-6 rounded-2xl font-black uppercase italic text-sm">Imprimer (1 page)</button>
            </div>
        </section>
    </main>

            </div>
        </div>
    </div>

        function getImgHTML(recipe, storeColor) {
            return `<div style="background-color: ${storeColor}; color: white; height: 100%; display: flex; align-items: center; justify-content: center;"><span>${recipe.name}</span></div>
                    <img class="recipe-img" src="${recipe.img}" onerror="this.style.opacity='0'">`;
        }

        function switchStore(id) {
            const config = storeData[id];
            document.body.style.setProperty('--store-color', config.color);
            document.getElementById('bannerTitle').innerHTML = `LE MENU <br> ${config.name}`;
            document.getElementById('heroImg').style.backgroundImage = `url('${config.hero}')`;
            document.getElementById('navBrandIcon').style.backgroundColor = config.color;
            document.getElementById('featuredItemName').innerText = config.vedette;
            document.getElementById('featuredPrice').innerText = config.vPrice;
            document.getElementById('circulaireLink').href = config.link;
            document.getElementById('circulaireName').innerText = config.name;
            document.getElementById('savingsPercent').innerText = config.savings;

            document.querySelectorAll('.store-tab').forEach(b => { 
                b.style.backgroundColor = 'transparent'; b.style.color = '#94a3b8'; 
            });
            const activeBtn = document.getElementById(`btn-${id}`);
            activeBtn.style.backgroundColor = config.color; activeBtn.style.color = 'white';
            render(id);
        }

        function render(storeId) {
            const store = storeData[storeId];
            const grid = document.getElementById('recipeGrid');
            const grocery = document.getElementById('groceryList');
            grid.innerHTML = ''; grocery.innerHTML = '';

            const first = store.recipes[0];
            document.getElementById('featuredRecipe').innerHTML = `
                <div class="recipe-card" style="border-color: ${store.color}44; height: 100%;">
                    <div class="img-container">${getImgHTML(first, store.color)}</div>
                    <h3 class="font-black text-3xl uppercase italic mb-8">${first.name}</h3>
                    <div class="flex justify-between items-center"><span class="text-5xl font-black italic" style="color:${store.color}">${first.price.toFixed(2)} $</span>
                    <button onclick='openModal("${storeId}", 0)' class="bg-slate-950 text-white text-[10px] font-black px-10 py-5 rounded-2xl uppercase italic">Détails</button></div>
                </div>`;

            store.recipes.slice(1).forEach((r, idx) => {
                grid.innerHTML += `
                    <div class="recipe-card" style="border-color: ${store.color}33;">
                        <div class="img-container">${getImgHTML(r, store.color)}</div>
                        <h3 class="font-black text-xl uppercase italic mb-8">${r.name}</h3>
                        <div class="flex justify-between items-center"><span class="text-3xl font-black italic" style="color:${store.color}">${r.price.toFixed(2)} $</span>
                        <button onclick='openModal("${storeId}", ${idx + 1})' class="bg-slate-950 text-white text-[10px] font-black px-7 py-4 rounded-2xl uppercase italic">Recette</button></div>
                    </div>`;
            });

            [...new Set(store.recipes.flatMap(r => r.items))].sort().forEach(item => {
                grocery.innerHTML += `
                    <div class="grocery-item flex items-center space-x-4 p-4 bg-white/5 rounded-2xl" onclick="this.classList.toggle('checked')">
                        <div class="check-box w-5 h-5 border-2 border-white/20 rounded-lg"></div>
                        <span class="text-[10px] font-bold uppercase italic tracking-widest">${item}</span>
                    </div>`;
            });

            document.getElementById('comparisonBars').innerHTML = Object.keys(storeData).map(s => {
                const val = parseInt(storeData[s].savings.replace('-',''));
                return `<div class="text-center"><div class="text-[10px] font-black mb-3" style="color:${storeData[s].color}">${storeData[s].savings}</div>
                    <div class="w-10 bg-slate-100 rounded-full h-40 mx-auto flex flex-col justify-end overflow-hidden"><div style="height:${val*2}px; background-color:${storeData[s].color}"></div></div>
                    <div class="text-[9px] font-black uppercase mt-4 text-slate-400 italic">${storeData[s].name}</div></div>`;
            }).join('');
        }

        function openModal(storeId, idx) {
            const store = storeData[storeId];
            const r = store.recipes[idx];
            document.getElementById('modalTitle').innerText = r.name;
            document.getElementById('modalImgContainer').innerHTML = getImgHTML(r, store.color);
            document.getElementById('modalSteps').innerHTML = r.steps.map((s, i) => `<div class="flex gap-6"><span class="text-slate-200 font-black italic text-4xl">0${i+1}</span><p class="pt-1">${s}</p></div>`).join('');
            document.getElementById('recipeModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('recipeModal').style.display = 'none'; }
        switchStore('superc');
    </script>
