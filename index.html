    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;0,900&display=swap" rel="stylesheet">
    <style>
        :root { --store-color: #e31e24; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #1a1a1a; margin: 0; overflow-x: hidden; }
        
        /* HEADER RESPONSIVE */
        .hero-banner { 
            min-height: 650px; background-color: var(--store-color);
            display: flex; align-items: center; padding: 2rem 5%; 
            position: relative; margin-bottom: 3rem; color: white; transition: 0.4s ease;
        }
        .hero-grid { 
            display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 2rem; width: 100%; align-items: center; 
        }
        
        .hero-img-container { 
            width: 280px; height: 380px; border-radius: 0.5rem; overflow: hidden; 
            box-shadow: 25px 25px 60px rgba(0,0,0,0.4); border: 3px solid white; flex-shrink: 0; 
        }
        .hero-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .comparateur-side { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); 
            padding: 2rem; border-radius: 1rem; border: 1px solid rgba(255, 255, 255, 0.2); 
        }
        .main-title { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; line-height: 0.8; text-transform: uppercase; letter-spacing: -3px; }
        .mission-text { font-size: 0.9rem; font-weight: 700; margin-top: 1rem; opacity: 0.9; line-height: 1.4; max-width: 400px; }
        
        .comp-val { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; line-height: 1; letter-spacing: -4px; margin-bottom: 1rem; }
        .bar-chart-container { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 2rem; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 15px; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .bar-fill { width: 100%; transition: height 0.6s ease; border-radius: 2px 2px 0 0; }
        .bar-label { font-size: 7px; font-weight: 900; text-transform: uppercase; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .bar-pct { font-size: 9px; font-weight: 900; }

        /* GRILLE DE RECETTES RESPONSIVE */
        .layout-container { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; padding: 0 5% 50px; 
        }
        
        /* MOBILE OVERRIDES */
        @media (max-width: 1024px) {
            .hero-grid { grid-template-columns: 1fr; }
            .layout-container { grid-template-columns: repeat(2, 1fr); }
            .hero-banner { min-height: auto; padding: 4rem 5%; }
            .hero-img-container { width: 200px; height: 280px; margin: 0 auto 2rem; }
            .vedette-info { text-align: center; }
            .vedette-flex { flex-direction: column; gap: 1rem; }
        }

        @media (max-width: 640px) {
            .layout-container { grid-template-columns: 1fr; }
            .nav-menu { display: flex; overflow-x: auto; gap: 1rem; padding-bottom: 10px; width: 100%; }
            .nav-link { white-space: nowrap; font-size: 0.7rem; }
            .modal-content { grid-template-columns: 1fr; height: 95vh; }
            .modal-scroll { padding: 2rem; }
            .list-grid { grid-template-columns: 1fr 1fr; }
        }

        .img-wrapper { height: 350px; width: 100%; margin-bottom: 1.5rem; position: relative; background: #eee; overflow: hidden; border-radius: 4px; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 2; }
        .img-fallback { z-index: 1; width: 100%; height: 100%; background: var(--store-color); color: white; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; }

        #recipeModal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 10px; }
        .modal-content { background: white; width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1fr 1.2fr; border-radius: 1rem; overflow: hidden; }
        .modal-scroll { padding: 3rem; overflow-y: auto; color: black; }

        .shopping-section { background: #f9f9f9; padding: 4rem 5%; border-top: 2px solid #eee; }
        .nav-link { font-weight: 800; text-transform: uppercase; font-size: 0.8rem; color: #999; padding: 8px 0; transition: 0.3s; }
        .nav-link.active { color: var(--store-color); border-bottom: 3px solid var(--store-color); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>

        function switchStore(id) {
            const s = storeData[id];
            document.documentElement.style.setProperty('--store-color', s.color);
            document.getElementById('mainTitle').innerHTML = `LE MENU<br>${s.name.toUpperCase()}`;
            document.getElementById('vName').innerText = s.vName;
            document.getElementById('vPrice').innerText = s.vPrice;
            document.getElementById('vImg').src = s.vImg;
            document.getElementById('mainDiscount').innerText = s.disc;
            document.getElementById('heroBg').style.backgroundColor = s.color;
            document.getElementById('circLink').href = s.link;

            let barHtml = '';
            Object.keys(storeData).forEach(k => {
                const item = storeData[k];
                const pctVal = parseInt(item.disc.replace('-',''));
                const h = pctVal * 1.5;
                const isActive = (k === id);
                const barColor = isActive ? 'white' : item.color;
                const opacity = isActive ? '1' : '0.6';

                barHtml += `
                    <div class="bar-wrapper">
                        <span class="bar-pct" style="opacity:${opacity}">${item.disc}</span>
                        <div class="bar-fill" style="height:${h}px; background-color:${barColor}; opacity:${opacity}; ${isActive ? 'border:1.5px solid white;' : ''}"></div>
                        <span class="bar-label" style="opacity:${opacity}">${item.name}</span>
                    </div>`;
            });
            document.getElementById('barBox').innerHTML = barHtml;

            let gridHtml = '';
            s.recipes.forEach((r, idx) => {
                gridHtml += `
                    <div class="recipe-card border-b-2 border-black pb-8">
                        <div class="img-wrapper" onclick="openDetails('${id}', ${idx})">
                            <img src="${r.img}" alt="${r.n}" onerror="this.style.display='none'">
                            <div class="img-fallback">${r.n}</div>
                        </div>
                        <h3 class="text-xl md:text-2xl font-black uppercase mb-4 leading-tight">${r.n}</h3>
                        <div class="flex justify-between items-center">
                            <p class="text-2xl md:text-3xl font-bold" style="color:var(--store-color)">${r.p}</p>
                            <button onclick="openDetails('${id}', ${idx})" class="text-[9px] font-black uppercase border-b-2 border-black">Détails</button>
                        </div>
                    </div>`;
            });
            document.getElementById('mainGrid').innerHTML = gridHtml;

            let ings = [];
            s.recipes.forEach(r => ings = [...ings, ...r.i]);
            document.getElementById('shoppingList').innerHTML = [...new Set(ings)].map(i => `<div class="py-2 border-b border-gray-200 font-bold italic text-xs md:text-sm">□ ${i}</div>`).join('');

            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.toggle('active', btn.id === `btn-${id}`));
        }

        function openDetails(storeId, idx) {
            const r = storeData[storeId].recipes[idx];
            document.getElementById('modalTitle').innerText = r.n;
            document.getElementById('modalDesc').innerText = r.d;
            document.getElementById('modalImg').src = r.img;
            document.getElementById('modalIngs').innerHTML = r.i.map(ing => `<div>• ${ing}</div>`).join('');
            document.getElementById('modalSteps').innerHTML = r.s.map((step, i) => `
                <div class="flex gap-4"><span class="font-black text-xl opacity-20">0${i+1}</span><p class="font-bold italic">${step}</p></div>
            `).join('');
            document.getElementById('recipeModal').style.display = 'flex';
        }
