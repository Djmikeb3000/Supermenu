    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --store-color: #e31e24; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; transition: all 0.5s ease; font-style: italic; }
        
        .nav-container { display: flex; flex-direction: column; align-items: center; padding: 1rem; gap: 1rem; }
        @media (min-width: 768px) { .nav-container { flex-direction: row; justify-content: space-between; } }

        .hero-banner { 
            position: relative; min-height: 550px; border-radius: 0 0 2rem 2rem; 
            display: flex; align-items: center; padding: 2rem 5%; color: white;
            overflow: hidden; background-color: #1a1a1a;
        }
        @media (min-width: 768px) { .hero-banner { height: 600px; border-radius: 0 0 4rem 4rem; padding: 0 8%; } }

        .hero-img-bg {
            position: absolute; right: 0; top: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; z-index: 1; 
            transition: background-image 0.8s ease-in-out;
            background-repeat: no-repeat;
        }
        @media (min-width: 768px) { .hero-img-bg { width: 65%; } }

        .hero-gradient {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(180deg, var(--store-color) 45%, rgba(0,0,0,0.4) 100%);
        }
        @media (min-width: 768px) { 
            .hero-gradient { background: linear-gradient(90deg, var(--store-color) 0%, var(--store-color) 50%, rgba(0,0,0,0) 95%); } 
        }

        .recipe-card { background: white; border-radius: 2.5rem; padding: 1.5rem; border: 2px solid transparent; transition: all 0.4s ease; height: 100%; }
        .img-container { height: 220px; width: 100%; border-radius: 2rem; overflow: hidden; margin-bottom: 1.5rem; position: relative; background: #eee; }
        .fallback-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 15px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; color: white; z-index: 1; }
        .recipe-img { height: 100%; width: 100%; object-fit: cover; position: absolute; z-index: 2; top:0; left:0; }

        .grocery-item.checked { opacity: 0.3; text-decoration: line-through; }
        
        #recipeModal { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); padding: 15px; overflow-y: auto; }
        .modal-content { background: white; max-width: 1100px; margin: 20px auto; border-radius: 2.5rem; display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 768px) { .modal-content { flex-direction: row; } }
        
        @media print { .no-print { display: none !important; } }

            document.getElementById('navBrandIcon').style.backgroundColor = config.color;
            document.getElementById('featuredItemName').innerText = config.vedette;
            document.getElementById('featuredPrice').innerText = config.vPrice;
            document.getElementById('circulaireName').innerText = config.name;
            document.getElementById('circulaireLink').href = config.url;
            document.getElementById('savingsPercent').innerText = config.savings;

            document.querySelectorAll('.store-tab').forEach(b => { 
                b.style.backgroundColor = 'transparent'; b.style.color = '#94a3b8'; 
            });
            const active = document.getElementById(`btn-${id}`);
            active.style.backgroundColor = config.color; active.style.color = 'white';
            render(id);
        }

        function render(storeId) {
            const store = storeData[storeId];
            const grid = document.getElementById('recipeGrid');
            const grocery = document.getElementById('groceryList');
            const featured = document.getElementById('featuredRecipeContainer');
            
            grid.innerHTML = ''; grocery.innerHTML = '';

            const f = store.recipes[0];
            featured.innerHTML = `
                <div class="recipe-card shadow-xl" style="border-color: ${store.color}44;">
                    <div class="img-container">
                        <div class="fallback-bg" style="background-color: ${store.color}">${f.name}</div>
                        <img class="recipe-img" src="${f.img}" onerror="this.style.display='none'">
                    </div>
                    <h3 class="font-black text-2xl uppercase italic mb-8">${f.name}</h3>
                    <div class="flex justify-between items-center"><span class="text-4xl font-black italic" style="color:${store.color}">${f.price.toFixed(2)} $</span>
                    <button onclick='openModal("${storeId}", 0)' class="bg-slate-950 text-white text-[10px] font-black px-8 py-4 rounded-2xl uppercase italic">Détails</button></div>
                </div>`;

            store.recipes.slice(1).forEach((r, idx) => {
                grid.innerHTML += `
                    <div class="recipe-card shadow-sm hover:shadow-xl transition-all">
                        <div class="img-container">
                            <div class="fallback-bg" style="background-color: ${store.color}">${r.name}</div>
                            <img class="recipe-img" src="${r.img}" onerror="this.style.display='none'">
                        </div>
                        <h3 class="font-black text-xl uppercase italic mb-8">${r.name}</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-2xl font-black italic" style="color:${store.color}">${r.price.toFixed(2)} $</span>
                            <button onclick='openModal("${storeId}", ${idx+1})' class="bg-slate-950 text-white text-[10px] font-black px-6 py-3 rounded-2xl uppercase italic">Détails</button>
                        </div>
                    </div>`;
            });

            const allItems = [...new Set(store.recipes.flatMap(r => r.items))].sort();
            allItems.forEach(item => {
                grocery.innerHTML += `
                    <div class="grocery-item flex items-center space-x-3 p-4 bg-white/10 rounded-2xl border border-white/20 cursor-pointer" onclick="this.classList.toggle('checked')">
                        <div class="w-5 h-5 border-2 border-white/30 rounded-md"></div>
                        <span class="text-[10px] font-bold uppercase italic tracking-wider">${item}</span>
                    </div>`;
            });

            document.getElementById('comparisonBars').innerHTML = Object.keys(storeData).map(s => {
                const val = parseInt(storeData[s].savings.replace('-',''));
                return `<div class="text-center flex flex-col items-center">
                    <div class="w-8 bg-slate-100 rounded-full h-32 flex flex-col justify-end overflow-hidden">
                        <div style="height:${val*1.8}% ; background-color:${storeData[s].color}"></div>
                    </div>
                    <span class="text-[8px] font-black uppercase mt-2 text-slate-400">${storeData[s].name}</span>
                </div>`;
            }).join('');
        }

        function openModal(storeId, idx) {
            const r = storeData[storeId].recipes[idx];
            document.getElementById('modalTitle').innerText = r.name;
            document.getElementById('modalImg').src = r.img;
            document.getElementById('modalImg').style.display = r.img ? 'block' : 'none';
            document.getElementById('modalSteps').innerHTML = r.steps.map((s, i) => `
                <div class="flex gap-4">
                    <span class="font-black text-slate-200 text-3xl">0${i+1}</span>
                    <p class="pt-1">${s}</p>
                </div>`).join('');
            document.getElementById('recipeModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { 
            document.getElementById('recipeModal').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }
        
        switchStore('superc');
    </script>
</body>
</html>
